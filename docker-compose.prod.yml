# Production compose для musicfy (мульти-инстанс).
# Запускается за общим reverse-proxy Traefik (/opt/edge, сеть web external).
# Никаких host-портов: TLS/80/443 терминирует Traefik, маршрут — через labels.
#
# Параметры инстанса (из .env, с дефолтами первого инстанса):
#   COMPOSE_PROJECT_NAME  — имя docker-compose project / Traefik router (default: musicfy)
#   SERVICE_DOMAIN        — публичный домен Host() (default: zavionix.shop)
#
# Запуск инстанса:
#   docker compose -p <proj> -f docker-compose.prod.yml --env-file .env up -d --build
#
# Первый инстанс: /opt/musicfy  → zavionix.shop  (COMPOSE_PROJECT_NAME=musicfy)
# Клон:          /opt/norqelia → norqelia.shop  (COMPOSE_PROJECT_NAME=norqelia)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicfy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: musicfy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicfy -d musicfy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  api:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-musicfy}-api:prod
    restart: unless-stopped
    env_file: .env
    environment:
      # Адрес БД задаём здесь, чтобы не зависеть от значения в .env.
      DATABASE_URL: postgresql+asyncpg://musicfy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/musicfy
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Уникальный router/service на инстанс: ${COMPOSE_PROJECT_NAME}.
      # Host — из SERVICE_DOMAIN (+ www-алиас для обратной совместимости с zavionix).
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-musicfy}.rule=Host(`${SERVICE_DOMAIN:-zavionix.shop}`) || Host(`www.${SERVICE_DOMAIN:-zavionix.shop}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-musicfy}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-musicfy}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-musicfy}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-musicfy}.loadbalancer.server.port=8000"

networks:
  web:
    external: true
  default: {}

volumes:
  pgdata: {}
