name: Deploy

# Деплой musicfy на общий Linux-сервер за Traefik (мульти-инстанс).
# Gating: деплой запускается ТОЛЬКО после успешного завершения workflow "CI"
# (workflow_run + completed). Job-level if пропускает деплой, если CI упал,
# событие не push или ветка не main. Деплоится ИМЕННО протестированный коммит
# (checkout ref: head_sha), а не последний main.
#
# Стратегия: rsync рабочего дерева на сервер (сервер НЕ ходит в приватный repo),
# затем docker compose up -d --build по SSH для КАЖДОГО инстанса из $INSTANCES.
# Секреты на сервере (/opt/<dir>/.env) при rsync НЕ перезаписываются (--exclude='.env').
#
# Формат INSTANCES: "dir:project …" (как в claude-ios).
#   musicfy:musicfy   → /opt/musicfy,  COMPOSE_PROJECT_NAME=musicfy,  zavionix.shop
#   norqelia:norqelia → /opt/norqelia, COMPOSE_PROJECT_NAME=norqelia, norqelia.shop
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Защита от параллельных деплоев. При workflow_run github.ref указывает на default
# branch, поэтому группируем по стабильному имени workflow.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Деплой только при успешном CI, push-событии и ветке main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Деплоим протестированный коммит, не последний main.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure shared Traefik network
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'docker network inspect web >/dev/null 2>&1 || docker network create web'

      - name: Rsync + deploy all instances
        env:
          # dir:project pairs. Добавлять новый инстанс СЮДА только после ручного
          # провижининга (/opt/<dir> + .env + healthz 200). См. docs/DEPLOYMENT.md §Мульти-инстанс.
          INSTANCES: "musicfy:musicfy norqelia:norqelia doravixo:doravixo"
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes)
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          for pair in $INSTANCES; do
            dir="${pair%%:*}"
            proj="${pair##*:}"
            echo "======== deploy $dir (project=$proj) ========"

            # Каталог должен существовать (провижининг — ручной; .env уже на месте).
            "${SSH[@]}" "$HOST" "test -d /opt/$dir && test -f /opt/$dir/.env"

            rsync -az --delete \
              -e "$RSYNC_SSH" \
              --exclude='.git' \
              --exclude='.env' \
              --exclude='.venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.pytest_cache' \
              --exclude='.ruff_cache' \
              --exclude='.coverage' \
              --exclude='.idea' \
              ./ "$HOST:/opt/$dir/"

            "${SSH[@]}" "$HOST" \
              "set -e
               cd /opt/$dir
               docker compose -p $proj -f docker-compose.prod.yml --env-file .env up -d --build
               ok=0
               for i in \$(seq 1 24); do
                 status=\$(docker inspect --format '{{.State.Health.Status}}' ${proj}-api-1 2>/dev/null || echo missing)
                 if [ \"\$status\" = healthy ]; then ok=1; break; fi
                 echo \"waiting for ${proj}-api-1 health: \$status (\$i/24)\"
                 sleep 5
               done
               if [ \"\$ok\" != 1 ]; then
                 echo \"${proj}-api-1 did not become healthy within timeout\" >&2
                 docker compose -p $proj -f docker-compose.prod.yml --env-file .env ps
                 exit 1
               fi"

            echo "======== $dir healthy ========"
          done

          # Prune только после подтверждения health всех инстансов.
          "${SSH[@]}" "$HOST" 'docker image prune -f'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
